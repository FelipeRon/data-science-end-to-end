name: pset2
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    volumes:
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 5s
      timeout: 5s
      retries: 20
  kestra:
    image: kestra/kestra:v2.0.7
    user: root
    command: server standalone
    env_file:
      - path: kestra/.env.kestra
        required: false
    volumes:
      - datos_kestra:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_USER:-admin@kestra.io}
              password: ${KESTRA_PASSWORD:-Admin1234}
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  spark:
    image: pset2-pipeline:local
    build: .
    profiles: [tools]
    env_file: .env
    volumes:
      - ./kestra/pset2_kestra.p8:/run/secrets/snowflake.p8:ro
      - ./output:/workspace/output
    command: ["python", "spark/construir_obt.py"]
  pipeline:
    image: pset2-pipeline:local
    build: .
    profiles: [tools]
    env_file: .env
    volumes:
      - ./kestra/pset2_kestra.p8:/run/secrets/snowflake.p8:ro
      - ./output:/workspace/output
    command: ["python", "scripts/run_pipeline.py"]
volumes:
  datos_postgres:
  datos_kestra:

